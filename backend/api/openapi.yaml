openapi: 3.0.3

info:
  title: BrainFocus Cloud API
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: Auth
    description: Registration and authentication operations

paths:
  /v1/auth/register:
    post:
      security: []
      tags:
        - Auth
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
      example:
        email: user@example.com
        password: strong-password-123
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
      example:
        id: "22222222-2222-4111-8111-222222222222"
        email: user@example.com
        created_at: "2026-01-02T15:04:44Z"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - request_id
            - details
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
      example:
        error:
          code: validation_error
          message: Request validation failed
          request_id: "22222222-2222-4111-8111-222222222222"
          details: {}

