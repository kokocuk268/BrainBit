services:
  postgres:
    image: postgres:18-alpine
    container_name: brainfocus-postgres
    environment:
      POSTGRES_USER: brainfocus
      POSTGRES_PASSWORD: brainfocus
      POSTGRES_DB: brainfocus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainfocus -d brainfocus"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  pgdata: